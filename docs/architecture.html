<title>AetherHound Architecture</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one page, two figures. Figure 1 is the system as lanes (acoustic, RF) from source to output.
   Figure 2 is the pipeline inside one detector. Same tokens as the simulator. */
:root{
  --bg:#edf0ee; --surface:#f8faf9; --fg:#16211f; --muted:#566763; --line:#b9c7c2;
  --accent:#0a7c74; --warn:#b4470d;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1413; --surface:#141e1c; --fg:#dfeae7; --muted:#93a8a3; --line:#35504d;
  --accent:#45cfc0; --warn:#ff9a5c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1413; --surface:#141e1c; --fg:#dfeae7; --muted:#93a8a3; --line:#35504d;
  --accent:#45cfc0; --warn:#ff9a5c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;
  padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1,p,figure{margin:0}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
h1{font:600 clamp(26px,5vw,36px)/1.08 var(--sans);letter-spacing:-.02em}
.lede{color:var(--muted);max-width:62ch;margin-top:8px;text-wrap:pretty}
figure{display:flex;flex-direction:column;gap:10px}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
svg{display:block;width:100%;min-width:820px;height:auto;color:var(--fg)}
figcaption{max-width:78ch;color:var(--muted);font-size:13px;text-wrap:pretty}
figcaption b{color:var(--fg);font-weight:600}
/* drawing styles live here because the SVG itself carries no style block */
svg text{fill:var(--fg);font-family:var(--sans);font-size:12px}
svg .tt{font-weight:600;font-size:12.5px}
svg .ts{font-size:11.5px;fill:var(--muted)}
svg .tm{font-family:var(--mono);font-size:11px;fill:var(--muted)}
svg .lane{font-family:var(--mono);font-size:11px;letter-spacing:.12em;fill:var(--muted)}
svg .box{fill:var(--bg);stroke:var(--line);stroke-width:1.2}
svg .hot{stroke:var(--warn);stroke-width:1.7}
svg .det{stroke:var(--accent);stroke-width:1.5}
svg .plan{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 4}
svg .ln{stroke:var(--fg);stroke-width:1.2;fill:none;opacity:.65}
svg .acc{stroke:var(--accent);stroke-width:1.7;fill:none}
svg .dash{stroke-dasharray:5 4}
svg .sep{stroke:var(--line);stroke-width:1;stroke-dasharray:2 5}
svg .mix{fill:var(--bg);stroke:var(--fg);stroke-width:1.2;opacity:.9}
svg .ah{fill:var(--fg);opacity:.65}
svg .aa{fill:var(--accent)}
svg .am{fill:var(--muted)}
svg .num{font-family:var(--mono);font-size:11px;fill:var(--accent);font-weight:500}
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">Design overview</p>
    <h1>AetherHound Architecture</h1>
    <p class="lede">How the simulated room, the five covert emitters and the detectors fit together in the browser simulator, and what one detector does with a signal.</p>
  </header>

  <figure>
    <div class="scroll">
      <svg viewBox="0 0 960 456" role="img" aria-label="Two lanes, acoustic and RF. In each, a covert emitter and a room model are summed into one signal, which the detectors analyse. Detectors report to one output panel. The detectors never see the emitter directly.">
        <defs>
          <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
          <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="aa" d="M0,0 L10,5 L0,10 z"/></marker>
          <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="am" d="M0,0 L10,5 L0,10 z"/></marker>
        </defs>

        <!-- controls -->
        <rect class="box" x="20" y="8" width="920" height="30" rx="6"/>
        <text x="480" y="28" text-anchor="middle">Controls: scenario · technique · emitter level · room noise · sensitivity</text>
        <line class="ln" x1="105" y1="38" x2="105" y2="70" marker-end="url(#ah)"/>
        <text class="tm" x="113" y="58">level, technique (both emitters)</text>
        <line class="ln" x1="605" y1="38" x2="605" y2="70" marker-end="url(#ah)"/>
        <text class="tm" x="613" y="58">sensitivity</text>

        <!-- acoustic lane -->
        <text class="lane" x="20" y="62">ACOUSTIC</text>
        <rect class="box hot" x="20" y="72" width="170" height="52" rx="6"/>
        <text class="tt" x="32" y="92">Covert emitter</text>
        <text class="ts" x="32" y="109">ultrasonic · fan · disk</text>
        <rect class="box" x="20" y="134" width="170" height="52" rx="6"/>
        <text class="tt" x="32" y="154">Room model</text>
        <text class="ts" x="32" y="171">hum, drift, background</text>
        <path class="ln" d="M190,98 L221,123" marker-end="url(#ah)"/>
        <path class="ln" d="M190,160 L221,135" marker-end="url(#ah)"/>
        <circle class="mix" cx="232" cy="129" r="11"/>
        <text x="232" y="133.5" text-anchor="middle">+</text>
        <line class="ln" x1="243" y1="129" x2="268" y2="129" marker-end="url(#ah)"/>

        <rect class="box" x="270" y="98" width="160" height="62" rx="6"/>
        <text class="tt" x="282" y="118">Microphone signal</text>
        <text class="ts" x="282" y="135">48 kHz, FFT 2048</text>
        <text class="ts" x="282" y="150">new frame every 21 ms</text>

        <path class="acc" d="M430,129 L498,94" marker-end="url(#aa)"/>
        <path class="acc" d="M430,129 L498,146" marker-end="url(#aa)"/>
        <path class="acc" d="M430,129 L498,198" marker-end="url(#aa)"/>
        <text class="tm" x="440" y="84">dB/bin</text>

        <rect class="box det" x="500" y="72" width="210" height="44" rx="6"/>
        <text class="tt" x="512" y="91">Ultrasonic detector</text>
        <text class="ts" x="512" y="106">16–23.5 kHz · 2 s window</text>
        <rect class="box det" x="500" y="124" width="210" height="44" rx="6"/>
        <text class="tt" x="512" y="143">Fan detector</text>
        <text class="ts" x="512" y="158">0.25–1.2 kHz · 4 s window</text>
        <rect class="box det" x="500" y="176" width="210" height="44" rx="6"/>
        <text class="tt" x="512" y="195">Disk detector</text>
        <text class="ts" x="512" y="210">1.5–6 kHz total energy · 4 s</text>

        <line class="acc" x1="710" y1="94" x2="758" y2="94" marker-end="url(#aa)"/>
        <line class="acc" x1="710" y1="146" x2="758" y2="146" marker-end="url(#aa)"/>
        <line class="acc" x1="710" y1="198" x2="758" y2="198" marker-end="url(#aa)"/>
        <text class="tm" x="716" y="88">alerts</text>

        <line class="sep" x1="20" y1="240" x2="740" y2="240"/>

        <!-- RF lane -->
        <text class="lane" x="20" y="260">RF</text>
        <rect class="box hot" x="20" y="268" width="170" height="52" rx="6"/>
        <text class="tt" x="32" y="288">Covert emitter</text>
        <text class="ts" x="32" y="305">carrier · video cable</text>
        <rect class="box" x="20" y="330" width="170" height="52" rx="6"/>
        <text class="tt" x="32" y="350">Room model</text>
        <text class="ts" x="32" y="367">noise floor, carriers</text>
        <path class="ln" d="M190,294 L221,319" marker-end="url(#ah)"/>
        <path class="ln" d="M190,356 L221,331" marker-end="url(#ah)"/>
        <circle class="mix" cx="232" cy="325" r="11"/>
        <text x="232" y="329.5" text-anchor="middle">+</text>
        <line class="ln" x1="243" y1="325" x2="268" y2="325" marker-end="url(#ah)"/>

        <rect class="box" x="270" y="294" width="160" height="62" rx="6"/>
        <text class="tt" x="282" y="314">RF receiver</text>
        <text class="ts" x="282" y="331">800 bins × 250 kHz</text>
        <text class="ts" x="282" y="346">0–200 MHz, 21 ms frames</text>

        <line class="acc" x1="430" y1="325" x2="498" y2="325" marker-end="url(#aa)"/>
        <text class="tm" x="438" y="318">dB/bin</text>
        <rect class="box det" x="500" y="303" width="210" height="44" rx="6"/>
        <text class="tt" x="512" y="322">RF detector</text>
        <text class="ts" x="512" y="337">0–200 MHz · 2 s window</text>
        <line class="acc" x1="710" y1="325" x2="758" y2="325" marker-end="url(#aa)"/>

        <!-- outputs -->
        <rect class="box" x="760" y="72" width="180" height="310" rx="6"/>
        <text class="tt" x="774" y="94">Outputs</text>
        <text class="ts" x="774" y="122">Spectrum + waterfall</text>
        <text class="ts" x="774" y="150">Findings</text>
        <text class="ts" x="774" y="166">  frequency · type · dB</text>
        <text class="ts" x="774" y="194">Event log</text>
        <text class="ts" x="774" y="222">Time to detect</text>
        <text class="ts" x="774" y="250">False alarms</text>
        <text class="ts" x="774" y="278">Impulses ignored</text>

        <!-- planned -->
        <line class="dash" stroke="currentColor" style="opacity:.55" x1="850" y1="382" x2="850" y2="402" marker-end="url(#am)"/>
        <text class="tm" x="858" y="396">results</text>
        <rect class="plan" x="270" y="404" width="670" height="40" rx="6"/>
        <text x="284" y="428">Planned: Python detectors · evaluation sweeps · attacker sender and receiver with bit error rate</text>
      </svg>
    </div>
    <figcaption><b>The detector only ever sees the mixed signal.</b> Each lane sums a covert emitter (orange outline) and a room model into one signal; the detectors (teal) work from that alone and never know whether an emitter is on. The Outputs panel then compares what they found with what the simulator was actually doing, which is how time to detect and false alarms are counted. Dashed means not built yet.</figcaption>
  </figure>

  <figure>
    <div class="scroll">
      <svg viewBox="0 0 960 236" role="img" aria-label="The seven steps of a narrowband detector in order: baseline, threshold, window, classify, group, pair or link, alert. An impulse guard feeds into the window step and freezes flags when a click is seen.">
        <defs>
          <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="aa" d="M0,0 L10,5 L0,10 z"/></marker>
          <marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="am" d="M0,0 L10,5 L0,10 z"/></marker>
        </defs>

        <rect class="box" x="190" y="6" width="300" height="60" rx="6"/>
        <text class="tt" x="204" y="26">Impulse guard</text>
        <text class="ts" x="204" y="43">25% of bins jump at once = a click</text>
        <text class="ts" x="204" y="57">hold this frame and the next</text>
        <line class="ln" x1="341" y1="66" x2="341" y2="96" marker-end="url(#ah3)"/>
        <text class="tm" x="349" y="86">freeze flags</text>

        <!-- step boxes: x = 8 + 136*i, w = 122 -->
        <rect class="box det" x="8" y="98" width="122" height="122" rx="6"/>
        <text class="num" x="20" y="118">1</text><text class="tt" x="34" y="118">Baseline</text>
        <text class="ts" x="20" y="142">Learn each bin's</text>
        <text class="ts" x="20" y="158">normal level in</text>
        <text class="ts" x="20" y="174">the first 3 s</text>

        <rect class="box det" x="144" y="98" width="122" height="122" rx="6"/>
        <text class="num" x="156" y="118">2</text><text class="tt" x="170" y="118">Threshold</text>
        <text class="ts" x="156" y="142">On if above the</text>
        <text class="ts" x="156" y="158">baseline by 9 dB</text>
        <text class="ts" x="156" y="174">for 2 frames</text>

        <rect class="box det" x="280" y="98" width="122" height="122" rx="6"/>
        <text class="num" x="292" y="118">3</text><text class="tt" x="306" y="118">Window</text>
        <text class="ts" x="292" y="142">Keep each bin's</text>
        <text class="ts" x="292" y="158">on/off history</text>
        <text class="ts" x="292" y="174">(2 s, fan 4 s)</text>

        <rect class="box det" x="416" y="98" width="122" height="122" rx="6"/>
        <text class="num" x="428" y="118">4</text><text class="tt" x="442" y="118">Classify</text>
        <text class="ts" x="428" y="142">Keyed: 4+ changes</text>
        <text class="ts" x="428" y="158">Steady: on, 2 or</text>
        <text class="ts" x="428" y="174">fewer changes</text>

        <rect class="box det" x="552" y="98" width="122" height="122" rx="6"/>
        <text class="num" x="564" y="118">5</text><text class="tt" x="578" y="118">Group</text>
        <text class="ts" x="564" y="142">Neighbouring bins</text>
        <text class="ts" x="564" y="158">form one line.</text>
        <text class="ts" x="564" y="174">Any steady bin</text>
        <text class="ts" x="564" y="190">makes it steady.</text>

        <rect class="box det" x="688" y="98" width="122" height="122" rx="6"/>
        <text class="num" x="700" y="118">6</text><text class="tt" x="714" y="118">Pair or link</text>
        <text class="ts" x="700" y="142">Take turns: FSK</text>
        <text class="ts" x="700" y="158">Switch together:</text>
        <text class="ts" x="700" y="174">linked lines</text>

        <rect class="box hot" x="824" y="98" width="122" height="122" rx="6"/>
        <text class="num" x="836" y="118" style="fill:var(--warn)">7</text><text class="tt" x="850" y="118">Alert</text>
        <text class="ts" x="836" y="142">Keyed for 0.5 s:</text>
        <text class="ts" x="836" y="158">raise alert.</text>
        <text class="ts" x="836" y="174">Quiet for 1.5 s:</text>
        <text class="ts" x="836" y="190">clear it.</text>

        <line class="acc" x1="130" y1="159" x2="143" y2="159" marker-end="url(#ah2)"/>
        <line class="acc" x1="266" y1="159" x2="279" y2="159" marker-end="url(#ah2)"/>
        <line class="acc" x1="402" y1="159" x2="415" y2="159" marker-end="url(#ah2)"/>
        <line class="acc" x1="538" y1="159" x2="551" y2="159" marker-end="url(#ah2)"/>
        <line class="acc" x1="674" y1="159" x2="687" y2="159" marker-end="url(#ah2)"/>
        <line class="acc" x1="810" y1="159" x2="823" y2="159" marker-end="url(#ah2)"/>
      </svg>
    </div>
    <figcaption><b>Every narrowband detector runs the same seven steps.</b> Only the frequency range and window length change between the ultrasonic, fan and RF detectors. The disk detector replaces steps 2 to 4 with total energy in 1.5–6 kHz and counts bursts instead. The numbers are the order a signal passes through.</figcaption>
  </figure>
</div>
